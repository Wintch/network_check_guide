name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/net_watchdog.py scripts/quick_check.py
      - run: bash -n scripts/setup_encrypted_dns.sh
      - run: pip install pytest && pytest -q
